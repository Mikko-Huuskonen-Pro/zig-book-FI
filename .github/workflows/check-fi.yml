name: Check Finnish book

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-fi-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::readr
            any::knitr
            any::rmarkdown
            any::stringr
            any::fs
            any::gt
            any::tibble
          needs: check

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Install Zig
        run: |
          ZIG_VERSION=0.16.0
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" -o zig.tar.xz
          tar -xf zig.tar.xz
          ZIG_DIR="$PWD/zig-x86_64-linux-${ZIG_VERSION}"
          echo "$ZIG_DIR" >> "$GITHUB_PATH"
          "$ZIG_DIR/zig" version

      - name: Verify build prerequisites
        run: Rscript scripts/verify-build-prereqs.R

      - name: Render Finnish book
        working-directory: fi
        run: quarto render
