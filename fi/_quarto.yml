# Suomenkielinen kirja. Rakenna: cd fi && quarto render

project:
  type: book
  output-dir: ../docs
  resources:
    - ../Cover
    - ../Figures
    - ../Assets

book:
  title: "Johdatus Zig:iin"
  subtitle: "projektipohjainen kirja"
  author: "Pedro Duarte Faria (suomennos: Mikko Huuskonen)"
  edition: 1
  date: "today"
  language: fi
  cover-image: "../Cover/cover-artv3.png"
  repo-url: https://github.com/Mikko-Huuskonen-Pro/zig-book-FI
  repo-actions: [edit, issue]
  chapters:
    - index.qmd
    - Chapters/01-zig-weird.qmd
    - Chapters/03-structs.qmd
    - Chapters/01-memory.qmd
    - Chapters/01-base64.qmd
    - Chapters/02-debugging.qmd
    - Chapters/05-pointers.qmd
    - Chapters/04-http-server.qmd
    - Chapters/03-unittests.qmd
    - Chapters/07-build-system.qmd
    - Chapters/09-error-handling.qmd
    - Chapters/09-data-structures.qmd
    - Chapters/10-stack-project.qmd
    - Chapters/12-file-op.qmd
    - Chapters/14-zig-c-interop.qmd
    - Chapters/13-image-filter.qmd
    - Chapters/14-threads.qmd
    - Chapters/15-vectors.qmd
    - Chapters/references.qmd

bibliography:
  - Assets/references-fi.bib
  - ../Assets/references.bib
execute:
  freeze: auto

highlight-style: github
format:
  html:
    lang: fi
    theme:
      light: [cosmo]
      dark: [darkly, ../Assets/theme-dark.scss]

website:
  site-url: https://mikko-huuskonen-pro.github.io/zig-book-FI/
